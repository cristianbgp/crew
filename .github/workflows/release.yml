name: prepare release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful four-platform CI run to prepare
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve tested commit
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          result=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r .conclusion <<< "$result")" = success
          test "$(jq -r .path <<< "$result")" = .github/workflows/ci.yml
          echo "sha=$(jq -r .head_sha <<< "$result")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tested.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          pattern: crew-*
          path: work/reviewed-artifacts
      - run: bun --no-env-file scripts/release.ts --directory work/reviewed-artifacts --prepare work/release
      - uses: actions/upload-artifact@v7
        with:
          name: crew-reviewed-release
          if-no-files-found: error
          retention-days: 14
          path: work/release
